<h2 mat-dialog-title>{{estadoFormulario}} Nuevo Producto</h2>
<mat-dialog-content>
    
    <form [formGroup]="productForm">
        <div class="product-container">
            <mat-form-field appearance="fill" color="accent">
                <mat-label>Nombre</mat-label>
                <input matInput placeholder="Nombre" formControlName="name" required/>
            </mat-form-field>

             <mat-form-field appearance="fill" color="accent">
                <mat-label>Precio</mat-label>
                <input matInput  type="number" placeholder="Nombre" formControlName="price" required/>
            </mat-form-field>

             <mat-form-field appearance="fill" color="accent">
                <mat-label>Cantidad</mat-label>
                <input matInput  type="number" placeholder="Cantidad" formControlName="account" required/>
            </mat-form-field>

             <mat-form-field appearance="fill" color="accent">
                <mat-label>Categoria</mat-label>
                <mat-select formControlName="category" required>
                    <mat-option *ngFor="let category of categories" [value]="category.id">
                        {{category.name}}
                    </mat-option>
                </mat-select>
            </mat-form-field>   

            <div>
                <mat-label>Foto: </mat-label>
                <label for="file-upload" class="subir">
                    Subir archivo
                </label>
                <input  id="file-upload" 
                accept="image/png, image/jpeg"
                type="file"
                (change)="onFileChange($event)"
                 formControlName="picture"
                 class="input-file">
                <span *ngIf="nameImg" class="name">{{nameImg}}</span>
                        </div>

        </div>
    </form>
</mat-dialog-content>

<mat-dialog-actions>
    <button mat-button color="primary" (click)="onSave()" [disabled]="productForm.invalid">
        <mat-icon>save</mat-icon>Guardar
    </button>
     <button mat-button color="primary" (click)="onCancel()">
        <mat-icon>cancel</mat-icon>Cancelar
    </button>
</mat-dialog-actions>
