<h1 mat-dialog-title>Confirmacion</h1>
<div mat-dialog-content>
    <p>¿Estas seguro de eliminar el registro?</p>
</div>
<div mat-dialog-actions>
    <button mat-button color="primary" (click)="delete()" cdkFocusInitial>Si</button>
    <button mat-button color="warn" (click)="onNoClick()">No</button>
</div>
