<div class="dashboard-container" [class.is-mobile]="mobileQuery.matches">
    <!--empieza toolbar-->
    <mat-toolbar color="primary" class="dashboard-toolbar">
       <button mat-icon-button (click)="snav.toggle()">
           <mat-icon>menu</mat-icon>
       </button>

        <h1 class="app-name">S-Inventory</h1>
    
        <div class="right">
            <ul class="navigation-items">
                <li>
                    <button mat-icon-button>
                        <mat-icon>help_outline</mat-icon>
                    </button>
                </li>
                <li>
                    <button mat-button [matMenuTriggerFor]="menu">
                        <mat-icon>person_outline</mat-icon>
                    </button>

                    <mat-menu #menu="matMenu">
                        <button mat-menu-item>
                            <mat-icon>exit_to_app</mat-icon>
                            <span>Cerrar sesión</span>
                        </button>
                    </mat-menu>
                </li>
            </ul>
        </div>
    </mat-toolbar>
    <!--termina toolbar-->

    <!--empieza el sidenav-->
    <mat-sidenav-container class="sidenav-container" 
        [style.marginTop.px]="mobileQuery.matches ? 56 : 0">

       <mat-sidenav #snav 
    [mode]="mobileQuery.matches ? 'over' : 'side'"
    [opened]="true"
    [fixedInViewport]="mobileQuery.matches" 
    [fixedTopGap]="56">

<!--profile-->
    <div class="profile-card">
                    <div class="header">
                        <h2>Nicolas Godoy</h2>
                        <h4>nicolas@gmail.com</h4>
                    </div>
                </div>
                <mat-divider></mat-divider>
            <mat-nav-list>
               <a mat-list-item [routerLink]="nav.route" *ngFor="let nav of menuNav">
                    <mat-icon matListItemIcon>{{nav.icon}}</mat-icon>
                        <span matListItemTitle>{{nav.name}}</span>
                </a>
            </mat-nav-list>

        </mat-sidenav>

        <!-- contenido -->
        <mat-sidenav-content>
            <router-outlet></router-outlet> 
        </mat-sidenav-content>

    </mat-sidenav-container>
   
</div>
